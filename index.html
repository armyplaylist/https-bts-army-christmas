px;background:#0f0c22ed;box-shadow:0 25px 100px #0009;backdrop-filter:blur(22px);pointer-events:auto}.panel h2{font:30px Georgia,serif;font-weight:400;margin:0 0 8px}.panel p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}.field{display:block;margin:13px 0}.field label{display:block;font-size:11px;color:#cbb8f2;margin-bottom:7px;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid #c6aaff33;background:#09091b;color:#fff;outline:none}.field textarea{resize:vertical;min-height:82px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.small{font-size:11px;color:#9e94b4;margin-top:14px;line-height:1.5}.toast{position:absolute;z-index:30;top:82px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:99px;background:#24183f;border:1px solid #c6aaff55;font-size:12px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}.star-message{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,320px);padding:18px;border-radius:17px;background:#17112b;border:1px solid #d2baff66;text-align:center;box-shadow:0 10px 50px #0009;pointer-events:auto}.star-message strong{font:22px Georgia,serif}.star-message p{font-size:13px;color:#d2c9e4;line-height:1.6}.footer{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#887e9f;font-size:9px;letter-spacing:.2em;pointer-events:none}@media(max-width:600px){.top{top:16px;left:16px;right:16px}.brand{font-size:10px}.top .ghost{padding:9px 12px;font-size:11px}.controls{bottom:22px}.controls button{font-size:12px;padding:10px 13px}.welcome{top:15%!important}}

const $=s=>document.querySelector(s),SUPABASE_URL='https://peppndfwhnhcrswqihss.supabase.co',SUPABASE_KEY='sb_publishable_6_5zZlRHGzXa0oLMzXs8nA_uUSdTT-v',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let data={title:'Mi cielo púrpura',note:'Cada estrella guarda un mensaje para ti.',stars:[]},sky=null,user=null,owner=false,live=null,busy=false,ready=false,booting=false;

function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('#skyTitle').textContent=data.title;$('#skyNote').textContent=data.note;const layer=$('#starLayer');layer.innerHTML='';data.stars.forEach((s,i)=>{const b=document.createElement('button');b.className='star';b.style.left=(50+Number(s.position_x||0))+'%';b.style.top=(50+Number(s.position_y||0))+'%';b.style.color=s.color;b.style.setProperty('--size',({small:17,medium:25,large:34}[s.size]||25)+'px');b.style.animationDelay=(i%7)*-.37+'s';const span=document.createElement('span');span.textContent=icons[s.shape]||'✦';b.appendChild(span);b.onclick=()=>showMessage(s);layer.appendChild(b)});$('#rename').classList.toggle('hidden',!owner);$('#decorate').classList.toggle('hidden',!owner)}
function showMessage(s){const m=$('#message');m.innerHTML='<strong>'+esc(s.sender_name||'Una ARMY')+'</strong><p>'+esc(s.dedication||'Una estrella para ti 💜')+'</p><button class="soft" id="closeMessage">Cerrar</button>';m.classList.remove('hidden');$('#closeMessage').onclick=()=>m.classList.add('hidden')}
async function loadStars(){if(!sky)return;const {data:rows,error}=await sb.from('stars').select('*').eq('sky_id',sky.id).eq('is_visible',true).order('created_at',{ascending:true});if(error){console.error(error);toast('No pudimos cargar las estrellas.');return}data.stars=rows||[];render()}
async function subscribe(){if(live)await sb.removeChannel(live);live=sb.channel('sky-'+sky.id).on('postgres_changes',{event:'*',schema:'public',table:'stars',filter:'sky_id=eq.'+sky.id},loadStars).on('postgres_changes',{event:'UPDATE',schema:'public',table:'skies',filter:'id=eq.'+sky.id},p=>{if(!owner){data.title=p.new.display_name;data.note=p.new.description;render()}}).subscribe()}
async function makeSky(){const slug='sky-'+crypto.randomUUID().replace(/-/g,'').slice(0,12),{data:r,error}=await sb.from('skies').insert({owner_id:user.id,slug,display_name:'Mi cielo púrpura',description:'Cada estrella guarda un mensaje para ti.',is_public:true}).select().single();if(error)throw error;sky=r;owner=true;history.replaceState(null,'',location.pathname+'?sky='+encodeURIComponent(slug))}
async function boot(){if(booting)return;booting=true;$('#enter').disabled=true;$('#enter').textContent='Conectando con tu cielo…';try{let {data:a,error}=await sb.auth.getSession();if(error)throw error;if(!a.session){const sign=await sb.auth.signInAnonymously();if(sign.error)throw sign.error;a=sign.data}user=a.session.user;const slug=new URLSearchParams(location.search).get('sky');if(slug){const r=await sb.from('skies').select('*').eq('slug',slug).eq('is_public',true).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('No encontramos este cielo.');sky=r.data;owner=sky.owner_id===user.id}else{const r=await sb.from('skies').select('*').eq('owner_id',user.id).maybeSingle();if(r.error)throw r.error;if(r.data){sky=r.data;owner=true}else await makeSky();history.replaceState(null,'',location.pathname+'?sky='+encodeURIComponent(sky.slug))}data.title=sky.display_name;data.note=sky.description;await loadStars();await subscribe();ready=true;$('#enter').disabled=false;$('#enter').textContent='Abrir mi cielo';toast('Tu cielo está listo 💜')}catch(e){console.error(e);ready=false;$('#enter').disabled=false;$('#enter').textContent='Reintentar conexión';toast('No se pudo cargar el cielo: '+(e.message||'comprueba tu conexión'))}finally{booting=false}}
function openModal(kind){const m=$('#modal');m.classList.remove('hidden');if(kind==='star'){m.innerHTML='<h2>Deja una estrella</h2><p>Escribe unas palabras para este cielo.</p><div class="field"><label>TU NOMBRE O @USUARIO</label><input id="from" maxlength="32" placeholder="Tu nombre"></div><div class="field"><label>DEDICATORIA</label><textarea id="words" maxlength="240" placeholder="Que esta estrella te recuerde..."></textarea></div><div class="field"><label>COLOR</label><select id="color">'+palette.map(c=>'<option value="'+c+'">✦ '+c+'</option>').join('')+'</select></div><div class="actions"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="place">Colocar estrella</button></div><div class="small">Tu estrella aparecerá en el cielo compartido.</div>';$('#place').onclick=async()=>{if(busy)return;if(!sky?.id){toast('El cielo aún no está conectado. Recarga e inténtalo de nuevo.');return}busy=true;$('#place').disabled=true;const pos={x:Math.round((Math.random()*40-20)*100)/100,y:Math.round((Math.random()*40-20)*100)/100};try{const {error}=await sb.from('stars').insert({sky_id:sky.id,sender_name:$('#from').value.trim()||'Una ARMY',dedication:$('#words').value.trim()||'Una estrella para ti 💜',color:$('#color').value,shape:'star',size:'medium',effect:'glow',position_x:pos.x,position_y:pos.y,position_z:0,is_visible:true});if(error)throw error;m.classList.add('hidden');await loadStars();toast('Tu estrella ya brilla aquí 💜')}catch(error){console.error('Error al colocar estrella:',error);toast('No se pudo guardar: '+(error?.message||'error de conexión'));$('#place').disabled=false}finally{busy=false}}}else if(kind==='edit'){m.innerHTML='<h2>Tu universo</h2><div class="field"><label>NOMBRE DEL CIELO</label><input id="title" maxlength="60" value="'+esc(data.title)+'"></div><div class="field"><label>MENSAJE DE BIENVENIDA</label><input id="note" maxlength="240" value="'+esc(data.note)+'"></div><div class="actions"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="place">Guardar</button></div>';$('#place').onclick=async()=>{const title=$('#title').value.trim()||'Mi cielo púrpura',note=$('#note').value.trim()||'Cada estrella guarda un mensaje para ti.',{error}=await sb.from('skies').update({display_name:title,description:note,updated_at:new Date().toISOString()}).eq('id',sky.id);if(error){toast('No pudimos guardar los cambios.');return}data.title=title;data.note=note;render();m.classList.add('hidden');toast('Cielo actualizado')}}else{m.innerHTML='<h2>Decora tu cielo</h2><div class="field"><label>SÍMBOLO</label><select id="symbol"><option value="star">✦ Estrella</option><option value="diamond">◆ Diamante</option><option value="heart">♡ Corazón</option><option value="moon">☾ Luna</option><option value="crystal">✧ Cristal</option></select></div><div class="actions"><button class="ghost" id="cancel">Cerrar</button><button class="primary" id="place">Aplicar</button></div>';$('#place').onclick=()=>{data.decor=$('#symbol').value;m.classList.add('hidden');toast('Símbolo seleccionado')}}$('#cancel').onclick=()=>m.classList.add('hidden')}
function share(){if(!sky){toast('Espera a que cargue tu cielo.');return}const url=location.origin+location.pathname+'?sky='+encodeURIComponent(sky.slug);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('Enlace único copiado 💜')).catch(()=>prompt('Copia este enlace:',url));else prompt('Copia este enlace:',url)}
function enter(){if(!ready){boot();return}$('#door').classList.add('open');setTimeout(()=>{$('#entry').classList.add('hidden');$('#inside').classList.remove('hidden');render()},900)}
function initCanvas(id,count,alpha){const c=$(id),ctx=c.getContext('2d');let pts=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pts=Array.from({length:count},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.25,a:Math.random()*.7+.2,v:Math.random()*.006+.002}))}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);pts.forEach(p=>{p.a+=Math.sin(Date.now()*p.v)*.002;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(226,211,255,'+(Math.max(.08,Math.min(.8,p.a))*alpha)+')';ctx.shadowBlur=5;ctx.shadowColor='#c7a8ff';ctx.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw()}
initCanvas('#stars',130,1);initCanvas('#dust',85,.45);$('#enter').addEventListener('click',enter);document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='addStar'){e.preventDefault();openModal('star')}else if(b.id==='rename'){e.preventDefault();openModal('edit')}else if(b.id==='decorate'){e.preventDefault();openModal('decor')}else if(b.id==='shareTop'||b.id==='shareBottom'){e.preventDefault();share()}},true);render();boot();
